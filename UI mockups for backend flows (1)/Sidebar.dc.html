<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width:60px;flex:0 0 60px;background:#fff;border-right:1px solid #E6E6EE;display:flex;flex-direction:column;align-items:center;padding:16px 0 14px;gap:20px">
  <div style="width:24px;height:24px;display:flex;align-items:center;justify-content:center;color:#1A1A2E">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.2" y2="16.2"></line></svg>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:14px">
    <sc-if value="{{ chatOn }}" hint-placeholder-val="{{ false }}">
      <div title="Chat" style="width:32px;height:32px;display:flex;align-items:center;justify-content:center;background:#FDEEF5;border:1px solid #F3BFD6;border-radius:8px;color:#D6246E"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.6l1.9 5.5L19.4 11l-5.5 1.9L12 18.4l-1.9-5.5L4.6 11l5.5-1.9z"></path></svg></div>
    </sc-if>
    <sc-if value="{{ chatOff }}" hint-placeholder-val="{{ true }}">
      <div title="Chat" style="width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:8px;color:#6E6E85" style-hover="color:#D6246E;background:#FDEEF5"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.6l1.9 5.5L19.4 11l-5.5 1.9L12 18.4l-1.9-5.5L4.6 11l5.5-1.9z"></path></svg></div>
    </sc-if>
    <sc-if value="{{ sessionsOn }}" hint-placeholder-val="{{ true }}">
      <div title="Sessions" style="width:32px;height:32px;display:flex;align-items:center;justify-content:center;background:#FDEEF5;border:1px solid #F3BFD6;border-radius:8px;color:#D6246E"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 20V11"></path><path d="M10 20V4.5"></path><path d="M16 20v-6.5"></path><path d="M2.5 20h19"></path></svg></div>
    </sc-if>
    <sc-if value="{{ sessionsOff }}" hint-placeholder-val="{{ false }}">
      <div title="Sessions" style="width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:8px;color:#6E6E85" style-hover="color:#D6246E;background:#FDEEF5"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 20V11"></path><path d="M10 20V4.5"></path><path d="M16 20v-6.5"></path><path d="M2.5 20h19"></path></svg></div>
    </sc-if>
    <sc-if value="{{ filesOn }}" hint-placeholder-val="{{ false }}">
      <div title="Files" style="width:32px;height:32px;display:flex;align-items:center;justify-content:center;background:#FDEEF5;border:1px solid #F3BFD6;border-radius:8px;color:#D6246E"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6.5h6l2 2.2h10V19a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"></path></svg></div>
    </sc-if>
    <sc-if value="{{ filesOff }}" hint-placeholder-val="{{ true }}">
      <div title="Files" style="width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:8px;color:#6E6E85" style-hover="color:#D6246E;background:#FDEEF5"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6.5h6l2 2.2h10V19a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"></path></svg></div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:60,&quot;height&quot;:260},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;chat&quot;,&quot;sessions&quot;,&quot;files&quot;],&quot;default&quot;:&quot;sessions&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active || "sessions";
    return {
      chatOn: a === "chat", chatOff: a !== "chat",
      sessionsOn: a === "sessions", sessionsOff: a !== "sessions",
      filesOn: a === "files", filesOff: a !== "files"
    };
  }
}
</script>
</body>
</html>
