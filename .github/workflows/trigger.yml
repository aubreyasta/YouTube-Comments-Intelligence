name: Trigger Deploy Webhook

on:
  push:
    branches:
      - main

jobs:
  webhook:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger webhook
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_MAIN }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::error::WEBHOOK_MAIN secret is not set or is empty."
            exit 1
          fi

          curl -fsS -X POST "$WEBHOOK_URL"
