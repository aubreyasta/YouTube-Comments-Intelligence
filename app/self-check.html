<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Resonance demo self-check</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 24px; color: #1A1A2E; }
  .pass { color: #2e7d32; } .fail { color: #B3452F; font-weight: 700; }
  li { margin: 2px 0; font-size: 13px; }
  #summary { font-size: 16px; font-weight: 700; margin: 12px 0; }
</style>
</head>
<body>
<h1>Store self-check</h1>
<div id="summary">Running…</div>
<ul id="results"></ul>
<!-- Minimal fixture application shell. app.js's boot queries these exact IDs;
     kept out of the results flow with aria-hidden/off-screen positioning
     rather than display:none, since app.js focuses #view and toggles sidebar
     classes on real elements. -->
<div id="fixture-shell" aria-hidden="true" style="position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden">
  <div id="topbar"></div>
  <div id="view" tabindex="-1"></div>
  <div id="overlay-root"></div>
  <a class="sb-item" id="sb-sessions" href="#/sessions"></a>
  <a class="sb-item" id="sb-files" href="#/files"></a>
</div>
<script>
  // Deterministic boot: force the mode probe's fetch to fail before app.js
  // loads, so demoApi.mode always resolves to "demo" regardless of whether a
  // real server happens to be listening on this origin. Restored right after
  // boot settles, before any test replaces window.fetch itself.
  window.fetch = function () { return Promise.reject(new Error("self-check: network disabled during boot")); };
  location.hash = "#/home";
</script>
<script src="live.js"></script>
<script src="app.js"></script>
<script>
(async function () {
  const out = document.getElementById("results");
  let pass = 0, fail = 0;
  function check(name, cond) {
    const li = document.createElement("li");
    li.className = cond ? "pass" : "fail";
    li.textContent = (cond ? "PASS " : "FAIL ") + name;
    out.appendChild(li);
    cond ? pass++ : fail++;
  }
  async function rejects(name, promise, code) {
    try { await promise; check(name + " (rejects)", false); }
    catch (e) { check(name + " (rejects: " + (e.code || e.message) + ")", !code || e.code === code); }
  }
  // Captures the stored draft before a rejected update, asserts the direct
  // error fields, then rereads and deep-compares to prove no mutation.
  async function rejectsNoMutation(name, sessionId, badMessages, expectField) {
    const before = await api.getKeyMessages(sessionId);
    try {
      await api.updateKeyMessages(sessionId, badMessages);
      check(name + " (rejects)", false);
      return;
    } catch (e) {
      check(name + " (field is 'messages')", e.field === expectField);
      const after = await api.getKeyMessages(sessionId);
      check(name + " (no mutation on reject)",
        after.status === before.status && after.error === before.error
        && after.revision === before.revision
        && JSON.stringify(after.messages) === JSON.stringify(before.messages));
    }
  }
  function until(pred, ms, label) {
    return new Promise((res, rej) => {
      const t0 = Date.now();
      const iv = setInterval(() => {
        if (pred()) { clearInterval(iv); res(); }
        else if (Date.now() - t0 > ms) { clearInterval(iv); rej(new Error("timeout: " + label)); }
      }, 50);
    });
  }
  // Restore real fetch now that boot has settled (mode probe already ran
  // and failed deterministically above, keeping demoApi.mode === "demo").
  window.fetch = window.__origFetchForSelfCheck || fetch;
  const api = window.demoApi;
  check("boot resolved to demo mode", api.mode === "demo");

  // --- Validation before mutation ---
  await rejects("blank session name", api.createSession({ name: "  ", campaignName: "C", videoUrls: ["https://youtu.be/abc1234"] }), "validation");
  await rejects("no videos", api.createSession({ name: "S", campaignName: "C", videoUrls: [] }), "validation");
  await rejects("playlist url", api.createSession({ name: "S", campaignName: "C", videoUrls: ["https://www.youtube.com/watch?v=abc1234&list=PLxyz"] }), "validation");
  await rejects("vimeo url", api.createSession({ name: "S", campaignName: "C", videoUrls: ["https://vimeo.com/12345"] }), "validation");
  await rejects("duplicate in list", api.createSession({ name: "S", campaignName: "C", videoUrls: ["https://youtu.be/abc1234", "https://www.youtube.com/watch?v=abc1234"] }), "validation");

  const { session, campaign } = await api.createSession({
    name: "Self-check", campaignName: "C1",
    videoUrls: ["https://youtu.be/abc1234", "https://www.youtube.com/shorts/xyz9876"],
  });
  check("session created ready", session.status === "ready");
  check("two videos created", campaign.videoIds.length === 2);

  const camp = await api.getCampaign(campaign.id);
  check("short kind detected", camp.videos[1].kind === "short");

  await rejects("duplicate video add", api.addVideo(campaign.id, "https://youtu.be/abc1234"), "validation");
  const v3 = await api.addVideo(campaign.id, "https://www.youtube.com/watch?v=newid99");
  check("video added", !!v3.id);
  await api.removeVideo(v3.id);
  check("video removed", (await api.getCampaign(campaign.id)).videos.length === 2);

  // --- Uploads ---
  const big = new File([new Uint8Array(10 * 1024 * 1024 + 1)], "big.pdf", { type: "application/pdf" });
  await rejects("oversize upload", api.uploadAsset(campaign.id, big), "validation");
  const bad = new File(["x"], "notes.exe", { type: "application/x-msdownload" });
  await rejects("bad extension", api.uploadAsset(campaign.id, bad), "validation");
  const doc = await api.uploadAsset(campaign.id, new File(["%PDF-1.4 demo"], "brief.pdf", { type: "application/pdf" }));
  check("document asset", doc.kind === "document" && doc.status === "ready");
  const img = await api.uploadAsset(campaign.id, new File(["fakepng"], "kv.png", { type: "image/png" }));
  check("image asset", img.kind === "image");
  try {
    await api.setKeyVisual(campaign.id, img.id);
    check("demoApi.setKeyVisual rejects", false);
  } catch (e) {
    check("demoApi.setKeyVisual rejects with exact fields",
      e.error === "FEATURE_UNAVAILABLE" && e.message === "Key visuals are not supported." && e.field === null);
  }
  try {
    await window.__liveApi.setKeyVisual(campaign.id, img.id);
    check("__liveApi.setKeyVisual rejects", false);
  } catch (e) {
    check("__liveApi.setKeyVisual rejects with exact fields",
      e.error === "FEATURE_UNAVAILABLE" && e.message === "Key visuals are not supported." && e.field === null);
  }

  await rejects("ftp article", api.addArticle(campaign.id, "ftp://example.com/x"), "validation");
  const art = await api.addArticle(campaign.id, "https://kompas.com/article");
  check("article asset", art.kind === "article" && art.sourceUrl.startsWith("https"));

  // --- Run lifecycle ---
  const run = await api.startRun(session.id);
  check("run starts queued/running", ["queued", "running"].includes(run.status));
  await rejects("second concurrent run", api.startRun(session.id), "conflict");
  await rejects("proceed before pause", api.proceedRun(run.id), "conflict");

  const seen = [];
  let lastEvent = null;
  const unsub = api.subscribeRun(run.id, {
    onEvent: (e) => { seen.push(e.stage); lastEvent = e; },
    onDisconnect: () => seen.push("disconnect"),
    onReconnect: () => seen.push("reconnect"),
  });

  await until(() => seen.includes("brief_pause"), 15000, "brief_pause");
  check("reached brief_pause", true);
  check("event shape is SSE-shaped",
    !!lastEvent && typeof lastEvent.run_id === "string" && "stage" in lastEvent
    && "message" in lastEvent && "pct" in lastEvent && typeof lastEvent.detail === "object");
  const runAtPause = await api.getRun(run.id);
  check("paused at 30%", runAtPause.pct === 30 && runAtPause.stage === "brief_pause");

  check("brief points seeded", runAtPause.briefPointIds.length >= 4);
  check("getRun exposes ordered briefPoints", Array.isArray(runAtPause.briefPoints)
    && runAtPause.briefPoints.length === runAtPause.briefPointIds.length
    && runAtPause.briefPoints.every((p, i) => i === 0 || p.order > runAtPause.briefPoints[i - 1].order));

  // zero-included rejection
  const zeroIncluded = runAtPause.briefPoints.map((p, i) => ({
    id: p.id, label: "P" + i, description: "", included: false, order: i,
  }));
  await rejects("all-excluded rejected", api.updateBriefPoints(run.id, zeroIncluded), "validation");

  // edit: keep two, reorder
  const edit = runAtPause.briefPoints.slice(0, 2).map((p, i) => ({
    id: p.id, label: i === 0 ? "Edited idea B" : "Edited idea A", description: "d", included: true, order: i,
  }));
  const saved = await api.updateBriefPoints(run.id, edit);
  check("points saved as {messages}", Array.isArray(saved.messages)
    && saved.messages.length === 2 && saved.messages[0].label === "Edited idea B");

  // disconnect during pause: no progress loss, auto reconnect
  await api.simulateDisconnect(run.id);
  await until(() => seen.includes("reconnect"), 12000, "reconnect");
  check("reconnected after disconnect", true);
  const afterDc = await api.getRun(run.id);
  check("stage retained through disconnect", afterDc.stage === "brief_pause");

  await api.proceedRun(run.id);
  await until(() => seen.includes("complete"), 25000, "complete");
  check("run completed", true);
  const seq = ["connecting", "collect", "brief", "brief_pause", "classify", "emotion", "report", "complete"];
  let last = -1, ordered = true;
  for (const s of seen) {
    const i = seq.indexOf(s);
    if (i >= 0) { if (i < last) ordered = false; last = Math.max(last, i); }
  }
  check("stage order monotonic", ordered);

  const sessAfter = await api.getSession(session.id);
  check("session complete with comments", sessAfter.status === "complete" && sessAfter.commentCount > 0);

  const report = await api.getReport(run.id);
  check("report exists", report.runId === run.id && report.transfers.length === 2);
  check("transfer labels follow edits", report.transfers[0].label === "Edited idea B");
  check("evidence attached", report.evidence.length > 0);
  check("evidence shape", report.evidence.every((e) => ["Joy", "Skeptical", "Neutral"].includes(e.emotion)));

  const files = await api.listFiles();
  const artifactNames = files.filter((f) => f._file === "artifact").map((f) => f.filename).sort();
  check("six public artifacts", JSON.stringify(artifactNames) === JSON.stringify(
    ["report.pdf", "comments.csv", "key-messages.csv", "themes.csv", "sentiment.csv", "emotions.csv"].sort()));
  const pdfArt = files.find((f) => f.filename === "report.pdf");
  check("pdf magic bytes", pdfArt.content.startsWith("%PDF-1.4"));
  const csvArt = files.find((f) => f.filename === "key-messages.csv");
  check("csv header", csvArt.content.startsWith("idea,share_pct"));

  unsub();
  const seenLen = seen.length;
  await new Promise((r) => setTimeout(r, 300));
  check("unsubscribe stops events", seen.length === seenLen);

  // Fresh run gets a fresh ID
  const run2 = await api.startRun(session.id);
  check("fresh run id", run2.id !== run.id);
  await api.simulateFailure(run2.id);
  await until(() => api.getRun(run2.id).then((r) => r.status === "failed"), 5000, "fail");
  const failedRun = await api.getRun(run2.id);
  check("failure terminal with error", failedRun.status === "failed" && !!failedRun.error);

  // --- Key Messages: demo/live method parity ---
  check("demoApi has Key Message methods",
    typeof api.getKeyMessages === "function" && typeof api.draftKeyMessages === "function"
    && typeof api.updateKeyMessages === "function");
  check("__liveApi has Key Message methods",
    typeof window.__liveApi.getKeyMessages === "function" && typeof window.__liveApi.draftKeyMessages === "function"
    && typeof window.__liveApi.updateKeyMessages === "function");
  check("Key Message method arity matches (demo vs live)",
    api.getKeyMessages.length === window.__liveApi.getKeyMessages.length
    && api.draftKeyMessages.length === window.__liveApi.draftKeyMessages.length
    && api.updateKeyMessages.length === window.__liveApi.updateKeyMessages.length);
  check("Key Message method arities are exactly 1,1,2",
    api.getKeyMessages.length === 1 && window.__liveApi.getKeyMessages.length === 1
    && api.draftKeyMessages.length === 1 && window.__liveApi.draftKeyMessages.length === 1
    && api.updateKeyMessages.length === 2 && window.__liveApi.updateKeyMessages.length === 2);

  // --- Key Messages: live, via mocked fetch (no network) ---
  const origFetch = window.fetch;
  try {
    let lastCall = null;
    window.fetch = async (url, opts) => {
      lastCall = { url, opts };
      return {
        ok: true,
        json: async () => ({
          id: "sess-1", keyMessages: { status: "ready", messages: [], error: null, revision: 3 },
        }),
      };
    };
    const got = await window.__liveApi.getKeyMessages("sess-1");
    check("live getKeyMessages: GET session URL",
      lastCall.url === "/api/sessions/sess-1" && (!lastCall.opts || !lastCall.opts.method));
    check("live getKeyMessages: extracts .keyMessages only",
      got.status === "ready" && got.revision === 3 && Array.isArray(got.messages));

    window.fetch = async (url, opts) => {
      lastCall = { url, opts };
      return {
        ok: true,
        json: async () => ({ status: "drafting", messages: [], error: null, revision: 1 }),
      };
    };
    const drafted = await window.__liveApi.draftKeyMessages("sess-1");
    check("live draftKeyMessages: POST draft URL",
      lastCall.url === "/api/sessions/sess-1/key_messages/draft" && lastCall.opts.method === "POST"
      && !lastCall.opts.body);
    check("live draftKeyMessages: returns KeyMessageDraft", drafted.status === "drafting");

    window.fetch = async (url, opts) => {
      lastCall = { url, opts };
      return {
        ok: true,
        json: async () => ({ status: "ready", messages: [{ id: "m1", label: "L", description: "", included: true, order: 0 }], error: null, revision: 2 }),
      };
    };
    const inputMsgs = [{ id: null, label: "L", description: "", included: true, order: 0 }];
    const updated = await window.__liveApi.updateKeyMessages("sess-1", inputMsgs);
    check("live updateKeyMessages: PATCH URL",
      lastCall.url === "/api/sessions/sess-1/key_messages" && lastCall.opts.method === "PATCH");
    check("live updateKeyMessages: body is exactly {messages}",
      JSON.stringify(JSON.parse(lastCall.opts.body)) === JSON.stringify({ messages: inputMsgs }));
    check("live updateKeyMessages: returns KeyMessageDraft", updated.messages.length === 1);

    window.fetch = async () => ({
      ok: false, status: 422,
      json: async () => ({ error: "validation", message: "Label required.", field: "messages" }),
    });
    try {
      await window.__liveApi.updateKeyMessages("sess-1", [{ id: null, label: "", description: "", included: true, order: 0 }]);
      check("live updateKeyMessages error path rejects", false);
    } catch (e) {
      check("live updateKeyMessages exposes direct error fields",
        e.error === "validation" && e.message === "Label required." && e.field === "messages");
      check("live updateKeyMessages keeps .code back-compat", e.code === "validation");
    }
  } finally {
    window.fetch = origFetch;
  }

  // --- Key Messages: demo, deterministic behaviour ---
  const { session: kmSession, campaign: kmCampaign } = await api.createSession({
    name: "KM session", campaignName: "KMC",
    videoUrls: ["https://youtu.be/kmvid0001"],
  });
  const emptyDraft = await api.getKeyMessages(kmSession.id);
  check("initial key messages empty",
    emptyDraft.status === "empty" && emptyDraft.messages.length === 0
    && emptyDraft.error === null && emptyDraft.revision === 0);

  const noAssetDraft = await api.draftKeyMessages(kmSession.id);
  check("draft with no assets stays empty",
    noAssetDraft.status === "empty" && noAssetDraft.messages.length === 0 && noAssetDraft.revision === 1);

  await api.uploadAsset(kmCampaign.id, new File(["%PDF-1.4"], "Brief One.pdf", { type: "application/pdf" }));
  await api.uploadAsset(kmCampaign.id, new File(["%PDF-1.4"], "Brief Two.pdf", { type: "application/pdf" }));
  const draft1 = await api.draftKeyMessages(kmSession.id);
  check("draft creates one message per asset",
    draft1.status === "ready" && draft1.messages.length === 2 && draft1.revision === 2);
  check("draft messages have server IDs and derived labels",
    draft1.messages.every((m) => !!m.id) && draft1.messages[0].label === "Brief One.pdf"
    && draft1.messages[1].label === "Brief Two.pdf");
  check("draft messages included by default", draft1.messages.every((m) => m.included === true));

  const draft2 = await api.draftKeyMessages(kmSession.id);
  check("draft preserves existing messages and still increments revision",
    draft2.messages.length === 2 && draft2.revision === 3
    && draft2.messages[0].id === draft1.messages[0].id);

  // --- Session independence and clone isolation ---
  const { session: kmSession2 } = await api.createSession({
    name: "KM session 2", campaignName: "KMC2",
    videoUrls: ["https://youtu.be/kmvid0002"],
  });
  const km2Initial = await api.getKeyMessages(kmSession2.id);
  check("second session key messages independent and empty",
    km2Initial.status === "empty" && km2Initial.messages.length === 0
    && km2Initial.revision === 0);
  check("first session unaffected by second session's existence",
    (await api.getKeyMessages(kmSession.id)).messages.length === 2);

  const clonedForMutation = await api.getKeyMessages(kmSession.id);
  clonedForMutation.status = "failed";
  clonedForMutation.messages.push({ id: "injected", label: "hack", description: "", included: true, order: 99 });
  clonedForMutation.messages[0].label = "mutated in place";
  const rereadAfterMutation = await api.getKeyMessages(kmSession.id);
  check("mutating a returned getKeyMessages object does not affect stored state",
    rereadAfterMutation.status === "ready" && rereadAfterMutation.messages.length === 2
    && rereadAfterMutation.messages[0].label === draft2.messages[0].label);

  const trimmed = await api.updateKeyMessages(kmSession.id, [
    { id: draft2.messages[1].id, label: "  Second  ", description: "  d2  ", included: true, order: 9 },
    { id: null, label: "Third", description: "", included: false, order: 0 },
  ]);
  check("update trims labels/descriptions", trimmed.messages[0].label === "Second" && trimmed.messages[0].description === "d2");
  check("update rewrites order from zero", trimmed.messages[0].order === 0 && trimmed.messages[1].order === 1);
  check("update assigns server ID for id:null", !!trimmed.messages[1].id && trimmed.messages[1].id !== draft2.messages[1].id);
  check("update revision unchanged", trimmed.revision === draft2.revision);
  check("update status ready when non-empty", trimmed.status === "ready");

  const allExcluded = await api.updateKeyMessages(kmSession.id, [
    { id: trimmed.messages[0].id, label: "Second", description: "d2", included: false, order: 0 },
  ]);
  check("all-excluded update accepted", allExcluded.status === "ready" && allExcluded.messages[0].included === false);

  const emptied = await api.updateKeyMessages(kmSession.id, []);
  check("empty list update sets status empty", emptied.status === "empty" && emptied.messages.length === 0);

  await rejectsNoMutation("blank label rejected", kmSession.id,
    [{ id: null, label: "  ", description: "", included: true, order: 0 }], "messages");
  await rejects("label over 120 chars rejected",
    api.updateKeyMessages(kmSession.id, [{ id: null, label: "x".repeat(121), description: "", included: true, order: 0 }]),
    "validation");
  await rejects("description over 500 chars rejected",
    api.updateKeyMessages(kmSession.id, [{ id: null, label: "OK", description: "x".repeat(501), included: true, order: 0 }]),
    "validation");
  const dupeId = crypto.randomUUID ? crypto.randomUUID() : "not-a-real-id-0000";
  await rejects("unknown id rejected",
    api.updateKeyMessages(kmSession.id, [{ id: dupeId, label: "OK", description: "", included: true, order: 0 }]),
    "validation");
  const seededDraft = await api.draftKeyMessages(kmSession.id);
  const realId = seededDraft.messages[0] ? seededDraft.messages[0].id : null;
  if (realId) {
    await rejects("duplicate id rejected",
      api.updateKeyMessages(kmSession.id, [
        { id: realId, label: "A", description: "", included: true, order: 0 },
        { id: realId, label: "B", description: "", included: true, order: 1 },
      ]),
      "validation");
  }

  // ================= Task 3.3: Session setup Key Message editor =================
  // Drives renderCampaign through real navigation and DOM events only. No
  // internals are imported; demoApi methods are temporarily swapped and
  // always restored in finally so later real calls are unaffected.

  function sleep(ms) { return new Promise((r) => setTimeout(r, ms)); }
  async function gotoHash(hash) {
    if (location.hash === hash) {
      window.dispatchEvent(new HashChangeEvent("hashchange"));
    } else {
      location.hash = hash;
    }
    await sleep(30); // let the async route()/renderCampaign settle
  }
  const kmView = document.getElementById("view");
  function q(sel) { return kmView.querySelector(sel); }
  function qa(sel) { return Array.from(kmView.querySelectorAll(sel)); }
  function fireClick(el) { el.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true })); }
  function fireInput(el, val) {
    el.value = val;
    el.dispatchEvent(new Event("input", { bubbles: true }));
  }
  function fireKey(el, key) {
    el.dispatchEvent(new KeyboardEvent("keydown", { key, bubbles: true, cancelable: true }));
  }
  function overlayConfirm() { return document.querySelector("#overlay-root .confirm-modal"); }

  const { session: t3Session, campaign: t3Campaign } = await api.createSession({
    name: "T3.3 session", campaignName: "T3.3C",
    videoUrls: ["https://youtu.be/t33vid001"],
  });
  await gotoHash(`#/sessions/${t3Session.id}/campaigns/${t3Campaign.id}`);
  check("T3.3: renderCampaign mounted the Key Messages section", !!q(".km-section"));
  check("T3.3: empty state copy exact",
    q(".km-empty") && q(".km-empty").textContent === "No Key Messages yet. Add User Inputs and we'll draft them - or add one yourself.");
  check("T3.3: status region is role=status aria-live=polite",
    q(".km-status") && q(".km-status").getAttribute("role") === "status"
    && q(".km-status").getAttribute("aria-live") === "polite");
  check("T3.3: editor section carries aria-busy", q(".km-section").hasAttribute("aria-busy"));

  // ---- 1. First draft after successful asset mutation; render happens first ----
  {
    const origDraft = api.draftKeyMessages;
    const origUpload = api.uploadAsset;
    let draftCallCount = 0;
    let renderedBeforeFirstDraftCall = null;
    api.draftKeyMessages = async function (...args) {
      draftCallCount++;
      // At the moment drafting is requested, the successful mutation's
      // rerender must already be reflected in the DOM (new asset row present).
      renderedBeforeFirstDraftCall = qa(".asset-row").length > 0;
      return origDraft.apply(api, args);
    };
    try {
      const file = new File(["%PDF-1.4"], "T3 Brief.pdf", { type: "application/pdf" });
      const fi = q("#file-input");
      Object.defineProperty(fi, "files", { value: [file], configurable: true });
      fireInput(fi, "");
      fi.dispatchEvent(new Event("change", { bubbles: true }));
      await sleep(60);
      check("T3.3: first draft fires after successful asset mutation", draftCallCount >= 1);
      check("T3.3: successful mutation render occurs before the draft call", renderedBeforeFirstDraftCall === true);
    } finally {
      api.draftKeyMessages = origDraft;
      api.uploadAsset = origUpload;
    }
  }

  // ---- 2. Failed asset mutation never drafts ----
  {
    const origDraft = api.draftKeyMessages;
    let draftCallCount = 0;
    api.draftKeyMessages = async function (...args) { draftCallCount++; return origDraft.apply(api, args); };
    try {
      const bad = new File(["x"], "bad.exe", { type: "application/x-msdownload" });
      const fi = q("#file-input");
      Object.defineProperty(fi, "files", { value: [bad], configurable: true });
      fi.dispatchEvent(new Event("change", { bubbles: true }));
      await sleep(60);
      check("T3.3: failed asset mutation yields zero draft calls", draftCallCount === 0);
      check("T3.3: failed upload keeps its error visible", !document.getElementById("asset-err").hidden);
    } finally {
      api.draftKeyMessages = origDraft;
    }
  }

  // ---- 3. Coalescing: two quick successful mutations while a draft is pending
  //         produce exactly one latest rerun and never more than one in flight ----
  await gotoHash(`#/sessions/${t3Session.id}/campaigns/${t3Campaign.id}`);
  {
    const origDraft = api.draftKeyMessages;
    let inFlightCount = 0;
    let maxConcurrent = 0;
    let callCount = 0;
    let resolvers = [];
    api.draftKeyMessages = function (...args) {
      callCount++;
      inFlightCount++;
      maxConcurrent = Math.max(maxConcurrent, inFlightCount);
      return new Promise((resolve) => {
        resolvers.push(() => {

    api.getRun = async function (id) { return id === pausedRun.id ? { ...pausedRun } : origGetRun.call(api, id); };
    api.subscribeRun = function (id, handlers) { return id === pausedRun.id ? (() => {}) : origSubscribe.call(api, id, handlers); };
    api.updateBriefPoints = async function () { throw demoErrorLike("validation", "Server rejected the save.", "messages"); };
    api.proceedRun = async function () { proceedCalls++; return {}; };
    try {
      await bpGoto(`#/runs/${pausedRun.id}`);
      await sleep(20);
      fireClick(bpQ('[data-down="0"]'));
      const descField = bpQ("#bp-desc-1");
      fireInput(descField, "edited description");
      descField.focus();
      fireClick(bpQ("#bp-confirm"));
      await sleep(20);
      check("T3.4: failed save shows the server error", bpQ("#bp-err").textContent === "Server rejected the save."
        && bpQ("#bp-err").hidden === false);
      check("T3.4: failed save retains edited order", bpQ("#bp-label-0").value === "Second" && bpQ("#bp-label-1").value === "First");
      check("T3.4: failed save retains edited description", bpQ("#bp-desc-1").value === "edited description");
      check("T3.4: failed save re-enables controls", bpQ("#bp-confirm").disabled === false);
      check("T3.4: failed save restores focus to the field that was focused on Save",
        document.activeElement === bpQ("#bp-desc-1"));
      check("T3.4: failed save never calls Proceed", proceedCalls === 0);
    } finally {
      api.getRun = origGetRun;
      api.subscribeRun = origSubscribe;
      api.updateBriefPoints = origUpdate;
      api.proceedRun = origProceed;
    }
  }
  function demoErrorLike(code, message, field) {
    const e = new Error(message);
    e.code = code; e.field = field || null;
    return e;
  }

  // ---- 7. Stale SSE cannot regress an authoritative persisted brief_pause ----
  {
    const origGetRun = api.getRun;
    const origSubscribe = api.subscribeRun;
    const seeded = [bp("r7a", "Kept", true, 0)];
    const pausedRun = makePausedRun(seeded);
    let capturedHandlers = null;
    api.getRun = async function (id) { return id === pausedRun.id ? { ...pausedRun } : origGetRun.call(api, id); };
    api.subscribeRun = function (id, handlers) {
      if (id === pausedRun.id) { capturedHandlers = handlers; return () => {}; }
      return origSubscribe.call(api, id, handlers);
    };
    try {
      await bpGoto(`#/runs/${pausedRun.id}`);
      await sleep(20);
      check("T3.4: review visible before any SSE event", bpQa(".brief-item").length === 1);
      // A stale buffered event ranked behind brief_pause must not hide/replace the review.
      capturedHandlers.onEvent({ run_id: pausedRun.id, stage: "collect", message: "stale", pct: 5, detail: {} });
      await sleep(10);
      check("T3.4: stale earlier-stage SSE does not regress the paused review", bpQa(".brief-item").length === 1
        && bpQ(".run-title").textContent !== "Connecting\u2026");
    } finally {
      api.getRun = origGetRun;
      api.subscribeRun = origSubscribe;
    }
  }

  // ---- 8. Stale SSE cannot regress a fresh initial complete/failed snapshot ----
  {
    const origGetRun = api.getRun;
    const origSubscribe = api.subscribeRun;
    const completeRun = {
      id: "t34-run-complete", sessionId: t3Session.id, status: "complete",
      stage: "complete", pct: 100, message: "Done", briefPointIds: [], briefPoints: [], error: null,
    };
    let capturedHandlers = null;
    api.getRun = async function (id) { return id === completeRun.id ? { ...completeRun } : origGetRun.call(api, id); };
    api.subscribeRun = function (id, handlers) {
      if (id === completeRun.id) { capturedHandlers = handlers; return () => {}; }
      return origSubscribe.call(api, id, handlers);
    };
    try {
      await bpGoto(`#/runs/${completeRun.id}`);
      await sleep(20);
      check("T3.4: fresh initial complete snapshot renders immediately", bpQ("#run-title").textContent === "Your note is ready");
      capturedHandlers.onEvent({ run_id: completeRun.id, stage: "classify", message: "stale", pct: 60, detail: {} });
      await sleep(10);
      check("T3.4: stale SSE cannot regress a fresh initial complete snapshot",
        bpQ("#run-title").textContent === "Your note is ready");
    } finally {
      api.getRun = origGetRun;
      api.subscribeRun = origSubscribe;
    }
  }

  // ---- 9. Method arities and live PATCH {messages} shape (mocked fetch, no network) ----
  check("T3.4: demoApi.updateBriefPoints arity is 2", api.updateBriefPoints.length === 2);
  check("T3.4: __liveApi.updateBriefPoints arity is 2", window.__liveApi.updateBriefPoints.length === 2);
  {
    const origFetch2 = window.fetch;
    try {
      let lastCall = null;
      window.fetch = async (url, opts) => {
        lastCall = { url, opts };
        return { ok: true, json: async () => ({ messages: [{ id: "x1", label: "L", description: "", included: true, order: 0 }] }) };
      };
      const msgs = [{ id: null, label: "L", description: "", included: true, order: 0 }];
      const res = await window.__liveApi.updateBriefPoints("run-abc", msgs);
      check("T3.4: live updateBriefPoints PATCH URL", lastCall.url === "/api/runs/run-abc/brief_points" && lastCall.opts.method === "PATCH");
      check("T3.4: live updateBriefPoints body is exactly {messages}",
        JSON.stringify(JSON.parse(lastCall.opts.body)) === JSON.stringify({ messages: msgs }));
      check("T3.4: live updateBriefPoints returns {messages}", Array.isArray(res.messages) && res.messages.length === 1);
    } finally {
      window.fetch = origFetch2;
    }
  }

  // ================= Task 3.5: public run artifacts and blob-first downloads =================
  // Stubs demoApi.getArtifact/downloadBlob/window.fetch as needed per scenario;
  // always restored in finally. No real network call and no real browser
  // download in any scenario below.

  const PUBLIC_KINDS_ORDERED = [
    { kind: "report_pdf", filename: "report.pdf", contentType: "application/pdf" },
    { kind: "comments_csv", filename: "comments.csv", contentType: "text/csv" },
    { kind: "key_messages_csv", filename: "key-messages.csv", contentType: "text/csv" },
    { kind: "themes_csv", filename: "themes.csv", contentType: "text/csv" },
    { kind: "sentiment_csv", filename: "sentiment.csv", contentType: "text/csv" },
    { kind: "emotions_csv", filename: "emotions.csv", contentType: "text/csv" },
  ];

  // ---- 1. Demo listArtifacts: exact six, exact order, exact kinds/filenames/MIME ----
  {
    const arts = await api.listArtifacts(run.id);
    check("T3.5: demo listArtifacts returns exactly six", arts.length === 6);
    check("T3.5: demo listArtifacts order/kind/filename/contentType exact",
      JSON.stringify(arts.map((a) => ({ kind: a.kind, filename: a.filename, contentType: a.contentType })))
      === JSON.stringify(PUBLIC_KINDS_ORDERED));
    check("T3.5: demo listArtifacts never exposes report_json",
      !arts.some((a) => a.kind === "report_json"));
    check("T3.5: demo listArtifacts never exposes obsolete filenames",
      !arts.some((a) => ["chart_transfer.csv", "chart_themes.csv", "summary.csv"].includes(a.filename)));
  }

  // ---- 2. Demo CSV artifacts: deterministic, trailing newline, valid headers ----
  {
    const arts = await api.listArtifacts(run.id);
    const byKind = new Map(arts.map((a) => [a.kind, a]));
    const expectHeader = {
      comments_csv: "author,emotion,theme_or_idea,text,likes",
      key_messages_csv: "idea,share_pct,evidence_count",
      themes_csv: "theme,share_pct",
      sentiment_csv: "sentiment,share_pct",
      emotions_csv: "emotion,count",
    };
    let headersOk = true, newlineOk = true;
    for (const [kind, header] of Object.entries(expectHeader)) {
      const a = byKind.get(kind);
      if (!a || !a.content.startsWith(header)) headersOk = false;
      if (!a || !a.content.endsWith("\n")) newlineOk = false;
    }
    check("T3.5: demo CSV artifacts have exact valid headers", headersOk);
    check("T3.5: demo CSV artifacts end with a trailing newline", newlineOk);
    const a1 = await api.getArtifact(byKind.get("comments_csv").id);
    const a2 = await api.getArtifact(byKind.get("comments_csv").id);
    check("T3.5: demo CSV content deterministic across getArtifact calls",
      a1.content.size === a2.content.size);
  }

  // ---- 3. Demo getArtifact returns a Blob with exact MIME, exact filename ----
  {
    const arts = await api.listArtifacts(run.id);
    const pdfMeta = arts.find((a) => a.kind === "report_pdf");
    const a = await api.getArtifact(pdfMeta.id);
    check("T3.5: demo getArtifact returns a Blob", a.content instanceof Blob);
    check("T3.5: demo getArtifact Blob type is exact MIME", a.content.type === "application/pdf");
    check("T3.5: demo getArtifact filename is exact", a.filename === "report.pdf");
  }

  // ---- 4. Files: only public artifact kinds ever appear, fixed order preserved ----
  {
    const files = await api.listFiles();
    const arts = files.filter((f) => f._file === "artifact" && f.runId === run.id);
    check("T3.5: Files never exposes report_json or a seventh artifact",
      arts.length === 6 && !arts.some((a) => a.kind === "report_json"));
    const sorted = [...arts].sort((a, b) =>
      PUBLIC_KINDS_ORDERED.findIndex((p) => p.kind === a.kind) - PUBLIC_KINDS_ORDERED.findIndex((p) => p.kind === b.kind));
    check("T3.5: Files artifact kinds match the fixed six", JSON.stringify(sorted.map((a) => a.kind).sort())
      === JSON.stringify(PUBLIC_KINDS_ORDERED.map((p) => p.kind).sort()));
  }

  // ---- 5. Live getArtifact: blob-first fetch, Content-Disposition filename (quoted) ----
  {
    const origFetch = window.fetch;
    try {
      let fetchedUrl = null;
      window.fetch = async (url) => {
        fetchedUrl = url;
        if (url === "/api/sessions") return { ok: true, json: async () => ([{ id: "s1" }]) };
        if (url === "/api/sessions/s1") {
          return { ok: true, json: async () => ({ runs: [{ id: "r1" }] }) };
        }
        if (url === "/api/runs/r1") {
          return {
            ok: true,
            json: async () => ({ id: "r1", artifacts: [
              { id: "art-1", kind: "themes_csv", filename: "themes.csv", contentType: "text/csv" },
            ] }),
          };
        }
        if (url === "/api/runs/r1/artifacts/art-1") {
          return {
            ok: true,
            headers: { get: (h) => h === "Content-Disposition" ? 'attachment; filename="themes.csv"' : null },
            blob: async () => new Blob(["theme,share_pct\n"], { type: "text/csv" }),
          };
        }
        throw new Error("unexpected fetch: " + url);
      };
      const a = await window.__liveApi.getArtifact("art-1");
      check("T3.5: live getArtifact fetches the artifact endpoint, not downloadUrl directly",
        fetchedUrl === "/api/runs/r1/artifacts/art-1");
      check("T3.5: live getArtifact returns a Blob", a.content instanceof Blob);
      check("T3.5: live getArtifact uses quoted Content-Disposition filename", a.filename === "themes.csv");
      check("T3.5: live getArtifact keeps the locked one-argument signature",
        window.__liveApi.getArtifact.length === 1);
    } finally {
      window.fetch = origFetch;
    }
  }

  // ---- 6. Live getArtifact: unquoted Content-Disposition filename, fallback to artifact.filename ----
  {
    const origFetch = window.fetch;
    try {
      window.fetch = async (url) => {
        if (url === "/api/sessions") return { ok: true, json: async () => ([{ id: "s2" }]) };
        if (url === "/api/sessions/s2") return { ok: true, json: async () => ({ runs: [{ id: "r2" }] }) };
        if (url === "/api/runs/r2") {
          return {
            ok: true,
            json: async () => ({ id: "r2", artifacts: [
              { id: "art-2", kind: "emotions_csv", filename: "emotions.csv", contentType: "text/csv" },
            ] }),
          };
        }
        if (url === "/api/runs/r2/artifacts/art-2") {
          return {
            ok: true,
            headers: { get: (h) => h === "Content-Disposition" ? "attachment; filename=emotions.csv" : null },
            blob: async () => new Blob(["emotion,count\n"], { type: "text/csv" }),
          };
        }
        throw new Error("unexpected fetch: " + url);
      };
      const a = await window.__liveApi.getArtifact("art-2");
      check("T3.5: live getArtifact parses unquoted Content-Disposition filename", a.filename === "emotions.csv");

      window.fetch = async (url) => {
        if (url === "/api/sessions") return { ok: true, json: async () => ([{ id: "s3" }]) };
        if (url === "/api/sessions/s3") return { ok: true, json: async () => ({ runs: [{ id: "r3" }] }) };
        if (url === "/api/runs/r3") {
          return {
            ok: true,
            json: async () => ({ id: "r3", artifacts: [
              { id: "art-3", kind: "sentiment_csv", filename: "sentiment.csv", contentType: "text/csv" },
            ] }),
          };
        }
        if (url === "/api/runs/r3/artifacts/art-3") {
          return {
            ok: true,
            headers: { get: () => null }, // header omits filename entirely
            blob: async () => new Blob(["sentiment,share_pct\n"], { type: "text/csv" }),
          };
        }
        throw new Error("unexpected fetch: " + url);
      };
      const a3 = await window.__liveApi.getArtifact("art-3");
      check("T3.5: live getArtifact falls back to artifact.filename when header omits it",
        a3.filename === "sentiment.csv");
    } finally {
      window.fetch = origFetch;
    }
  }

  // ---- 7. Live listArtifacts/listFiles filter to the six public kinds even if the backend adds report_json ----
  {
    const origFetch = window.fetch;
    try {
      const malformedArtifacts = PUBLIC_KINDS_ORDERED.map((p, i) => ({ id: "mid-" + i, ...p }))
        .concat([{ id: "mid-json", kind: "report_json", filename: "report.json", contentType: "application/json" }]);
      window.fetch = async (url) => {
        if (url === "/api/runs/r4") {
          return { ok: true, json: async () => ({ id: "r4", status: "complete", artifacts: malformedArtifacts }) };
        }
        if (url === "/api/sessions") return { ok: true, json: async () => ([{ id: "s4" }]) };
        if (url === "/api/sessions/s4") {
          return { ok: true, json: async () => ({ campaignIds: [], campaigns: [], runs: [{ id: "r4", status: "complete" }] }) };
        }
        throw new Error("unexpected fetch: " + url);
      };
      const artifacts = await window.__liveApi.listArtifacts("r4");
      check("T3.5: live listArtifacts drops report_json even if the backend sends it",
        artifacts.length === 6 && !artifacts.some((a) => a.kind === "report_json"));
      check("T3.5: live listArtifacts preserves contract order",
        JSON.stringify(artifacts.map((a) => a.kind)) === JSON.stringify(PUBLIC_KINDS_ORDERED.map((p) => p.kind)));

      const files = await window.__liveApi.listFiles();
      const r4Artifacts = files.filter((f) => f._file === "artifact" && malformedArtifacts.some((m) => m.id === f.id));
      check("T3.5: live listFiles drops report_json even if the backend sends it",
        r4Artifacts.length === 6 && !r4Artifacts.some((a) => a.kind === "report_json"));
    } finally {
      window.fetch = origFetch;
    }
  }

  // ---- 8. Results: six ordered controls, missing artifact disabled with exact copy ----
  {
    const origListArtifacts = api.listArtifacts;
    api.listArtifacts = async function (id) {
      if (id !== run.id) return origListArtifacts.call(api, id);
      const all = await origListArtifacts.call(api, id);
      return all.filter((a) => a.kind !== "emotions_csv"); // simulate one missing artifact
    };
    try {
      await gotoHash(`#/runs/${run.id}/results`);
      const controls = kmView.querySelectorAll("[data-artifact]");
      check("T3.5: Results renders exactly six ordered artifact controls", controls.length === 6);
      check("T3.5: Results controls follow contract order",
        Array.from(controls).map((c) => c.dataset.artifact).join(",")
        === PUBLIC_KINDS_ORDERED.map((p) => p.kind).join(","));
      const missing = kmView.querySelector('[data-artifact="emotions_csv"]');
      check("T3.5: missing artifact control is disabled", missing && missing.disabled === true);
      const missingWrap = missing.closest(".dis-wrap");
      check("T3.5: missing artifact shows exact explanatory copy",
        !!missingWrap && missingWrap.getAttribute("aria-label") === "This file was not generated.");
    } finally {
      api.listArtifacts = origListArtifacts;
    }
  }

  // ---- 9. Results: live blob-first download, no direct navigation to downloadUrl ----
  {
    const origGetArtifact = api.getArtifact;
    const origDownloadBlobCalls = [];
    const win = window;
    const origOpen = win.open;
    win.open = function () { throw new Error("must not navigate directly for artifact download"); };
    let getArtifactCalledWith = null;
    api.getArtifact = async function (id) {
      getArtifactCalledWith = id;
      return { id, runId: run.id, kind: "themes_csv", filename: "themes.csv", contentType: "text/csv",
        content: new Blob(["theme,share_pct\n"], { type: "text/csv" }) };
    };
    try {
      await gotoHash(`#/runs/${run.id}/results`);
      const btn = kmView.querySelector('[data-artifact="themes_csv"]');
      check("T3.5: themes_csv control present for click test", !!btn);
      fireClick(btn);
      await sleep(20);
      check("T3.5: Results click fetches via demoApi.getArtifact, not downloadUrl", getArtifactCalledWith !== null);
    } finally {
      api.getArtifact = origGetArtifact;
      win.open = origOpen;
    }
  }

  // ---- 10. Results: download failure is announced in a live error region with exact copy ----
  {
    const origGetArtifact = api.getArtifact;
    api.getArtifact = async function () { throw demoErrorLike("network", "boom", null); };
    try {
      await gotoHash(`#/runs/${run.id}/results`);
      const btn = kmView.querySelector('[data-artifact="report_pdf"]') || document.getElementById("btn-pdf");
      fireClick(btn);
      await sleep(20);
      const region = document.querySelector('[role="alert"]#results-dl-live-err, [role="alert"]#results-dl-err');
      check("T3.5: Results announces exact failure copy in a live region",
        !!region && region.textContent === "Download failed. Try again.");
    } finally {
      api.getArtifact = origGetArtifact;
    }
  }

  // ---- 11. Files: each row's handler downloads its own clicked artifact, no undefined f, no outer capture ----
  {
    const origGetArtifact = api.getArtifact;
    const seenIds = [];
    api.getArtifact = async function (id) {
      seenIds.push(id);
      const arts = await origListArtifacts_forFiles();
      const match = arts.find((a) => a.id === id);
      return { ...match, content: new Blob([match ? "x" : ""], { type: match ? match.contentType : "text/plain" }) };
    };
    async function origListArtifacts_forFiles() {
      return api.listArtifacts.call === undefined ? [] : await window.demoApi.listArtifacts(run.id);
    }
    try {
      await gotoHash("#/files");
      const rows = kmView.querySelectorAll('[data-dl-file][data-kind="artifact"]');
      check("T3.5: Files renders artifact download rows", rows.length >= 2);
      const first = rows[0], second = rows[1];
      const firstId = first.dataset.dlFile, secondId = second.dataset.dlFile;
      check("T3.5: distinct rows carry distinct artifact ids", firstId !== secondId);
      fireClick(first);
      await sleep(20);
      fireClick(second);
      await sleep(20);
      check("T3.5: each Files click resolves its own clicked artifact by id, not an undefined/outer var",
        seenIds.includes(firstId) && seenIds.includes(secondId));
    } finally {
      api.getArtifact = origGetArtifact;
    }
  }

  // ---- 12. Files: download failure announced with exact copy, per-row isolation preserved ----
  {
    const origGetArtifact = api.getArtifact;
    api.getArtifact = async function () { throw demoErrorLike("network", "boom", null); };
    try {
      await gotoHash("#/files");
      const row = kmView.querySelector('[data-dl-file][data-kind="artifact"]');
      fireClick(row);
      await sleep(20);
      const region = document.getElementById("files-dl-err");
      check("T3.5: Files announces exact failure copy in a live region",
        !!region && region.textContent === "Download failed. Try again.");
    } finally {
      api.getArtifact = origGetArtifact;
    }
  }

  // ---- 13. demoApi public method signatures unchanged by this task ----
  check("T3.5: demoApi.getArtifact keeps its locked one-argument signature", api.getArtifact.length === 1);
  check("T3.5: demoApi.listArtifacts keeps its locked one-argument signature", api.listArtifacts.length === 1);
  check("T3.5: demoApi.listFiles keeps its locked zero-argument signature", api.listFiles.length === 0);

  const summary = document.getElementById("summary");
  summary.textContent = pass + " passed, " + fail + " failed";
  summary.className = fail ? "fail" : "pass";
})().catch((e) => {
  const summary = document.getElementById("summary");
  summary.textContent = "SELF-CHECK ERROR: " + e.message;
  summary.className = "fail";
});
</script>
</body>
