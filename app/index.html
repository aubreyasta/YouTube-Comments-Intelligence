<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resonance — comment intelligence</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <nav class="sidebar" aria-label="Primary">
    <a class="sb-brand" href="#/home" aria-label="Resonance home">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.2" y2="16.2"></line></svg>
    </a>
    <div class="sb-items">
      <button class="sb-item" id="sb-chat" disabled aria-disabled="true" title="Chat — not available in this local demo">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.6l1.9 5.5L19.4 11l-5.5 1.9L12 18.4l-1.9-5.5L4.6 11l5.5-1.9z"></path></svg>
        <span class="sr-only">Chat (unavailable in this local demo)</span>
      </button>
      <a class="sb-item" id="sb-sessions" href="#/sessions" title="Sessions">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 20V11"></path><path d="M10 20V4.5"></path><path d="M16 20v-6.5"></path><path d="M2.5 20h19"></path></svg>
        <span class="sr-only">Sessions</span>
      </a>
      <a class="sb-item" id="sb-files" href="#/files" title="Files">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6.5h6l2 2.2h10V19a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"></path></svg>
        <span class="sr-only">Files</span>
      </a>
    </div>
  </nav>
  <div class="main" id="main">
    <header class="topbar" id="topbar"></header>
    <main class="view" id="view" tabindex="-1"></main>
  </div>
</div>
<div id="overlay-root"></div>
<script src="app.js"></script>
</body>
</html>
